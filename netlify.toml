[build]
  # Pre-renders the live menu into menu.html (see scripts/build-menu-snapshot.mjs).
  command = "node scripts/build-menu-snapshot.mjs"
  publish = "."

[[redirects]]
  from = "/admin/*"
  to = "https://rera-os-admin-web-rerastreat.vercel.app/admin/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/events/feedback"
  to = "/feedback.html"
  status = 200

[[redirects]]
  from = "/events/*"
  to = "/events.html"
  status = 200

[[redirects]]
  from = "/journal"
  to = "/journal.html"
  status = 200

[[redirects]]
  from = "/journal/*"
  to = "/journal.html"
  status = 200
